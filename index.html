<style>
:root{
  --graphite:#2E2C2B; --graphite-2:#3A3735; --silver:#C9C6C3; --ink:#F3F2F1; --muted:#A8A4A0;
  --map-bg:#E4E6E4; --outside:#CFD2CF; --road:#FFFFFF; --road-major:#F4F1EA; --road-edge:#C4C8C4;
  --r1:#0E7C86; --r2:#D1812A; --r3:#7A4FB5; --excl:#B3413A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --map-bg:#262626; --outside:#1B1B1B; --road:#3D3D3D; --road-major:#565350; --road-edge:#2F2F2F; } }
:root[data-theme="dark"]{ --map-bg:#262626; --outside:#1B1B1B; --road:#3D3D3D; --road-major:#565350; --road-edge:#2F2F2F; }
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;font-family:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--graphite);color:var(--ink)}
.app{display:grid;grid-template-columns:360px 1fr;height:100%}
aside{background:var(--graphite);display:flex;flex-direction:column;min-height:0;border-right:1px solid #45423F}
.brand{display:flex;gap:14px;align-items:center;padding:18px 20px 14px}
.brand img{width:64px;height:auto;border-radius:6px;display:block}
.brand h1{font-size:1.3rem;font-weight:600;margin:0;line-height:1.15;letter-spacing:.01em}
.brand p{margin:3px 0 0;font-size:.85rem;color:var(--muted);font-weight:300}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:0 20px;border:1px solid #4A4744;border-radius:10px;overflow:hidden}
.stat{padding:10px 12px;border-right:1px solid #4A4744}
.stat:last-child{border-right:0}
.stat b{display:block;font-size:1.5rem;font-weight:600;line-height:1}
.stat span{font-size:.75rem;color:var(--muted);line-height:1.2;display:block;margin-top:4px}
.section{padding:16px 20px 0}
.section h2{font-size:.95rem;font-weight:500;margin:0 0 8px;color:var(--silver)}
.routes{display:flex;flex-direction:column;gap:6px}
.route{all:unset;cursor:pointer;display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-radius:8px;background:var(--graphite-2);border:1px solid transparent}
.route:hover{border-color:#5A5652}
.route[aria-pressed="true"]{border-color:var(--silver);background:#46423F}
.route:focus-visible,.item:focus-visible,input:focus-visible,.chk:focus-within{outline:2px solid var(--silver);outline-offset:2px}
.sw{width:14px;height:14px;border-radius:50%}
.route .t{font-weight:500}
.route .m{font-size:.8rem;color:var(--muted)}
.tools{display:flex;gap:10px;align-items:center;padding:14px 20px 8px}
.tools input[type=search]{flex:1;min-width:0;font:inherit;font-size:.9rem;padding:8px 11px;border-radius:8px;border:1px solid #55514E;background:#252322;color:var(--ink)}
.chk{display:flex;gap:6px;align-items:center;font-size:.82rem;color:var(--muted);white-space:nowrap;cursor:pointer}
.chk input{accent-color:var(--excl)}
.list{flex:1;overflow:auto;padding:0 12px 12px;min-height:0}
.item{all:unset;cursor:pointer;display:grid;grid-template-columns:30px 1fr;gap:10px;padding:8px;border-radius:8px;width:100%;box-sizing:border-box}
.item:hover{background:var(--graphite-2)}
.num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.78rem;font-weight:600;color:#fff}
.num.x{background:transparent;border:2px solid var(--excl);color:var(--excl)}
.item .n{font-size:.92rem;font-weight:500;line-height:1.25}
.item .d{font-size:.78rem;color:var(--muted);line-height:1.3}
.empty{padding:16px 8px;color:var(--muted);font-size:.9rem}
.foot{padding:10px 20px 14px;font-size:.72rem;color:var(--muted);border-top:1px solid #45423F;line-height:1.4}
#map{background:var(--map-bg);height:100%;width:100%}
.leaflet-container{font-family:inherit;background:var(--map-bg)}
.leaflet-popup-content-wrapper{border-radius:10px}
.pop h3{margin:0 0 2px;font-size:1rem;font-weight:600;color:#2E2C2B}
.pop .id{font-size:.75rem;color:#77726E;margin-bottom:8px}
.pop table{border-collapse:collapse;font-size:.82rem;color:#2E2C2B}
.pop td{padding:2px 0;vertical-align:top}
.pop td:first-child{color:#77726E;padding-right:10px;white-space:nowrap}
.pin{border-radius:50%;color:#fff;font:600 11px/20px "Outfit",sans-serif;text-align:center;width:20px;height:20px;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.legend{background:rgba(255,255,255,.92);color:#2E2C2B;padding:8px 11px;border-radius:8px;font-size:.78rem;line-height:1.6}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:48% 52%}
  aside{order:2;border-right:0;border-top:1px solid #45423F}
  #map{order:1}
  .brand{padding:12px 16px 10px}.brand img{width:48px}
  .stats{margin:0 16px}.section{padding:12px 16px 0}.tools{padding:10px 16px 6px}
  .routes{flex-direction:row;overflow-x:auto}
  .route{min-width:150px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const RC = {1:css('--r1'),2:css('--r2'),3:css('--r3')};
const EXC = css('--excl');
const map = L.map('map',{preferCanvas:true,zoomControl:true,attributionControl:true,minZoom:12,maxZoom:19,zoomSnap:0.25});
map.attributionControl.setPrefix('').addAttribution('© OpenStreetMap');
const renderer = L.canvas({padding:.5});

// máscara fuera del distrito
const world=[[-90,-180],[-90,180],[90,180],[90,-180]];
L.polygon([world,DATA.district.coords],{renderer,stroke:false,fillColor:css('--outside'),fillOpacity:1,interactive:false}).addTo(map);
// vías
const minor=[],major=[];
DATA.roads.forEach(r=>(r.c==='major'?major:minor).push(r.p));
L.polyline(minor,{renderer,color:css('--road'),weight:2,interactive:false}).addTo(map);
L.polyline(major,{renderer,color:css('--road-edge'),weight:6,interactive:false}).addTo(map);
L.polyline(major,{renderer,color:css('--road-major'),weight:4,interactive:false}).addTo(map);
const dist=L.polygon(DATA.district.coords,{renderer,color:'#2E2C2B',weight:2,fill:false,dashArray:'6 5',interactive:false}).addTo(map);
map.fitBounds(dist.getBounds(),{padding:[8,8]});

const B = DATA.bodegas, V=B.filter(b=>b.status==='valida'), X=B.filter(b=>b.status!=='valida');
document.getElementById('sV').textContent=V.length;
document.getElementById('sR').textContent=DATA.routes.length;
document.getElementById('sX').textContent=X.length;

const tipo={convenience:'Bodega / minimarket',supermarket:'Supermercado',kiosk:'Quiosco',general:'Tienda general',greengrocer:'Verdulería'};
function popup(b){
  const rows=[['Tipo',tipo[b.shop]||b.shop],['Dirección',b.dir]];
  if(b.status==='valida'){rows.push(['Ruta','Ruta '+b.ruta+', visita '+b.orden])}
  else rows.push(['Control','Excluida: '+b.motivo]);
  rows.push(['Coordenadas',b.lat.toFixed(5)+', '+b.lon.toFixed(5)]);
  return `<div class="pop"><h3>${esc(b.name)}</h3><div class="id">${b.id}</div><table>${rows.map(r=>`<tr><td>${r[0]}</td><td>${esc(r[1])}</td></tr>`).join('')}</table></div>`;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

const layers={dots:L.layerGroup().addTo(map),pins:L.layerGroup().addTo(map),line:L.layerGroup().addTo(map),x:L.layerGroup()};
const markerOf={};
V.forEach(b=>{
  const m=L.circleMarker([b.lat,b.lon],{renderer,radius:6,color:'#fff',weight:1.5,fillColor:RC[b.ruta],fillOpacity:1}).bindPopup(popup(b));
  m.addTo(layers.dots); markerOf[b.id]=m;
});
X.forEach(b=>{
  const m=L.circleMarker([b.lat,b.lon],{renderer,radius:5,color:EXC,weight:2,fillColor:'#fff',fillOpacity:1}).bindPopup(popup(b));
  m.addTo(layers.x); markerOf[b.id]=m;
});

const legend=L.control({position:'bottomright'});
legend.onAdd=()=>{const d=L.DomUtil.create('div','legend');
  d.innerHTML=DATA.routes.map(r=>`<div><i style="background:${RC[r.id]}"></i>Ruta ${r.id}</div>`).join('')+`<div><i style="border:2px solid ${EXC};width:8px;height:8px"></i>Excluida por control</div>`;return d};
legend.addTo(map);

let active=0;
const routesEl=document.getElementById('routes');
function routeBtn(id,label,meta,color){
  const b=document.createElement('button');b.className='route';b.setAttribute('aria-pressed','false');b.dataset.id=id;
  b.innerHTML=`<span class="sw" style="background:${color}"></span><span><span class="t">${label}</span><br><span class="m">${meta}</span></span>`;
  b.onclick=()=>select(id);routesEl.appendChild(b);
}
routeBtn(0,'Todas las rutas',V.length+' bodegas','conic-gradient('+RC[1]+' 0 33%,'+RC[2]+' 0 66%,'+RC[3]+' 0)');
DATA.routes.forEach(r=>routeBtn(r.id,'Ruta '+r.id,r.n+' bodegas, '+r.km+' km aprox.',RC[r.id]));

function select(id){
  active=id;
  routesEl.querySelectorAll('.route').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.id===id)));
  layers.pins.clearLayers();layers.line.clearLayers();
  V.forEach(b=>markerOf[b.id].setStyle({fillOpacity:!id||b.ruta===id?1:.18,opacity:!id||b.ruta===id?1:.25}));
  if(id){
    const seq=V.filter(b=>b.ruta===id).sort((a,b)=>a.orden-b.orden);
    L.polyline(seq.map(b=>[b.lat,b.lon]),{color:RC[id],weight:3,opacity:.85,dashArray:'2 6',lineCap:'round',interactive:false}).addTo(layers.line);
    seq.forEach(b=>{
      L.marker([b.lat,b.lon],{icon:L.divIcon({className:'',html:`<div class="pin" style="background:${RC[id]}">${b.orden}</div>`,iconSize:[24,24],iconAnchor:[12,12]}),zIndexOffset:b.orden}).bindPopup(popup(b)).addTo(layers.pins);
    });
    map.flyToBounds(L.latLngBounds(seq.map(b=>[b.lat,b.lon])),{padding:[40,40],duration:.6});
  } else map.flyToBounds(dist.getBounds(),{padding:[20,20],duration:.6});
  renderList();
}

const q=document.getElementById('q'), showX=document.getElementById('showX'), list=document.getElementById('list');
q.oninput=renderList;
showX.onchange=()=>{showX.checked?layers.x.addTo(map):map.removeLayer(layers.x);renderList()};
function renderList(){
  const s=q.value.trim().toLowerCase();
  let rows=V.filter(b=>!active||b.ruta===active).sort((a,b)=>a.ruta-b.ruta||a.orden-b.orden);
  if(showX.checked&&!active) rows=rows.concat(X);
  if(s) rows=rows.filter(b=>b.name.toLowerCase().includes(s)||b.id.toLowerCase().includes(s));
  list.innerHTML='';
  if(!rows.length){list.innerHTML='<div class="empty">No hay bodegas con ese nombre o código. Revisa lo escrito o elige "Todas las rutas".</div>';return}
  rows.forEach(b=>{
    const el=document.createElement('button');el.className='item';el.setAttribute('role','listitem');
    const ok=b.status==='valida';
    el.innerHTML=`<span class="num ${ok?'':'x'}" style="${ok?'background:'+RC[b.ruta]:''}">${ok?b.orden:'×'}</span><span><span class="n">${esc(b.name)}</span><br><span class="d">${b.id}. ${esc(ok?b.dir:b.motivo)}</span></span>`;
    el.onclick=()=>{ if(!ok&&!showX.checked){showX.checked=true;layers.x.addTo(map)}
      map.flyTo([b.lat,b.lon],17,{duration:.6}); setTimeout(()=>markerOf[b.id].openPopup(),650)};
    list.appendChild(el);
  });
}
renderList();
</script>
